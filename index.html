<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 悬浮小说阅读器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: none;
            outline: none;
            box-shadow: none;
            margin: 0;
            padding: 0;
        }
        .float-bar {
            width: 24px;
            height: 80px;
            background: transparent;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: default;
            box-shadow: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .float-bar .drag-region {
            width: 24px;
            height: 28px;
            -webkit-app-region: drag;
            cursor: grab;
            border-radius: 12px 12px 0 0;
        }
        .float-bar .icon-area {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .float-bar .icon-area:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
        }
        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 12px;
            cursor: ns-resize;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 0 0 12px 12px;
            -webkit-app-region: no-drag;
        }
        .resize-handle:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        /* 阅读器容器 - 完全无框 */
        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: transparent;
            overflow: hidden;
            border: none;
            outline: none;
            box-shadow: none;
            backdrop-filter: blur(20px);
        }
        .toolbar {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.92) 0%, rgba(139, 92, 246, 0.92) 100%);
            padding: 30px 15px 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: white;
            cursor: default;
            user-select: none;
            border: none;
            outline: none;
            position: relative;
            min-height: 75px;
            flex-shrink: 0;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 工具栏拖拽区域 */
        .toolbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            -webkit-app-region: drag;
        }
        .toolbar:active { cursor: grabbing; }
        .btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            box-shadow: none;
        }
        .btn:hover { 
            background: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }
        .btn:active { 
            transform: translateY(0);
        }
        #title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
        .font-slider, .opacity-slider {
            width: 90px;
            height: 5px;
            accent-color: white;
            -webkit-app-region: no-drag;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        #title { -webkit-app-region: no-drag; }
        .reading-area {
            flex: 1 1 auto;
            padding: 24px 32px;
            overflow-y: auto;
            line-height: 2.2;
            font-size: 16px;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.82);
            text-shadow: none;
            -webkit-font-smoothing: antialiased;
            width: 100%;
            min-height: 60px;
            border-radius: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif;
        }
        /* 工具栏展开按钮 */
        /* 隐藏滚动条 */
        .reading-area::-webkit-scrollbar {
            display: none;
        }
        .reading-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .reading-area p {
            margin-bottom: 20px;
            text-indent: 2em;
            text-shadow: none;
            letter-spacing: 0.5px;
        }
        .chapter-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            letter-spacing: 2px;
        }
        .progress-bar {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .progress-slider {
            flex: 1;
            height: 4px;
            accent-color: #6366f1;
            border-radius: 2px;
        }
        .color-wrapper {
            position: relative;
            display: inline-block;
            -webkit-app-region: no-drag;
        }
        .color-picker-panel {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            padding: 8px;
            -webkit-app-region: no-drag;
        }
        .color-presets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .color-opt {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .color-opt:hover {
            transform: scale(1.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .toc-panel {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-height: 60%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            overflow: hidden;
            -webkit-app-region: no-drag;
        }
        .toc-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-size: 14px;
        }
        .toc-close-btn {
            padding: 4px 8px;
            font-size: 14px;
        }
        .toc-list {
            padding: 8px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .toc-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: background 0.15s ease;
        }
        .toc-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        .toc-item.active {
            color: #667eea;
            font-weight: 600;
            background: rgba(102, 126, 234, 0.08);
        }
        .loading { text-align: center; color: #999; padding-top: 50px; }

    </style>
</head>
<body>
    <!-- 悬浮条 -->
    <div id="floatBar" class="float-bar">
        <div class="drag-region" id="dragRegion"></div>
        <div class="icon-area" id="iconArea">📖</div>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>
    
    <!-- 阅读器主界面 -->
    <div id="readerContainer" class="reader-container" style="display: none;">
        <div class="toolbar">
            <!-- 第一行 -->
            <div class="toolbar-row">
                <button class="btn" onclick="openFile()" title="上传小说">📁</button>
                <span id="title">未选择小说</span>
                <button class="btn chapter-btn" onclick="prevChapter()" title="上一章">⏮️</button>
                <button class="btn chapter-btn" onclick="nextChapter()" title="下一章">⏭️</button>
                <button class="btn lock-btn" id="lockBtn" onclick="toggleLock()" title="锁定窗口">🔓</button>
                <button class="btn auto-scroll-btn" id="autoScrollBtn" onclick="toggleAutoScroll()" title="自动滚动">▶️</button>
                <button class="btn toc-btn" id="tocBtn" onclick="toggleToc()" title="章节目录">📑</button>
                <button class="btn color-btn" id="colorBtn" onclick="toggleColorPicker()" title="字体颜色">🎨</button>
                <div class="color-picker-panel" id="colorPickerPanel">
                    <div class="color-presets">
                        <div class="color-opt" style="background:#2d3436" onclick="changeFontColor('#2d3436')" title="默认深灰"></div>
                        <div class="color-opt" style="background:#000000" onclick="changeFontColor('#000000')" title="纯黑"></div>
                        <div class="color-opt" style="background:#c0392b" onclick="changeFontColor('#c0392b')" title="红色"></div>
                        <div class="color-opt" style="background:#e67e22" onclick="changeFontColor('#e67e22')" title="橙色"></div>
                        <div class="color-opt" style="background:#f39c12" onclick="changeFontColor('#f39c12')" title="黄色"></div>
                        <div class="color-opt" style="background:#27ae60" onclick="changeFontColor('#27ae60')" title="绿色"></div>
                        <div class="color-opt" style="background:#2980b9" onclick="changeFontColor('#2980b9')" title="蓝色"></div>
                        <div class="color-opt" style="background:#8e44ad" onclick="changeFontColor('#8e44ad')" title="紫色"></div>
                        <div class="color-opt" style="background:#ffffff; border:1px solid #ddd;" onclick="changeFontColor('#ffffff')" title="白色"></div>
                        <div class="color-opt" style="background:#95a5a6" onclick="changeFontColor('#95a5a6')" title="灰色"></div>
                    </div>
                </div>
                <button class="btn" id="toggleToolbarBtn" onclick="toggleToolbar()" title="收起工具栏">⬆️</button>
            </div>
            <!-- 第二行 -->
            <div class="toolbar-row">
                <span style="font-size:11px;">🔤</span>
                <input type="range" class="font-slider" min="12" max="24" value="15" oninput="changeFont(this.value)" title="字体">
                <span style="font-size:11px;">🔆</span>
                <input type="range" class="opacity-slider" id="opacitySlider" min="0" max="100" value="80" oninput="changeOpacity(this.value)" title="透明度">
                <button class="btn resize-btn" onclick="resizeWindow('preset', 'small')" title="小窗口">📱</button>
                <button class="btn resize-btn" onclick="resizeWindow('preset', 'medium')" title="中窗口">💻</button>
                <button class="btn resize-btn" onclick="resizeWindow('preset', 'large')" title="大窗口">🖥️</button>
            </div>
        </div>
        <div class="reading-area" id="readingArea">
            <div class="loading">
                <p>📚 点击上传按钮或输入网址</p>
            </div>
        </div>
        <div class="toc-panel" id="tocPanel">
            <div class="toc-header">
                <span>章节目录</span>
                <button class="btn toc-close-btn" onclick="toggleToc()">✕</button>
            </div>
            <div class="toc-list" id="tocList"></div>
        </div>
        <div class="progress-bar">
            <input type="range" class="progress-slider" min="0" max="100" value="0" oninput="seekTo(this.value)">
            <span id="progress">0%</span>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".txt" style="display: none;">

    <script>
        const { ipcRenderer } = require('electron');
        const floatBar = document.getElementById('floatBar');
        const resizeHandle = document.getElementById('resizeHandle');
        const iconArea = document.getElementById('iconArea');
        let isResizing = false;
        const readerContainer = document.getElementById('readerContainer');
        const readingArea = document.getElementById('readingArea');
        const titleSpan = document.getElementById('title');
        const progressSpan = document.getElementById('progress');

        
        let chapters = [];
        let currentChapter = 0;
        let currentFilename = '';
        let isDragging = false;
        let isLocked = false;  // 窗口锁定状态
        let toolbarCollapsed = false;  // 工具栏收起状态
        let fontColor = '#2d3436';  // 默认字体颜色
        let autoScrollSpeed = 0;  // 0=关闭, 1=慢速, 2=快速
        let autoScrollTimer = null;  // 自动滚动定时器
        
        // 初始化透明度
        const opacitySlider = document.getElementById('opacitySlider');
        const savedOpacity = localStorage.getItem('novelReader_opacity') || '80';
        opacitySlider.value = savedOpacity;
        changeOpacity(savedOpacity);
        
        // 初始化字体颜色
        fontColor = localStorage.getItem('novelReader_fontColor') || '#2d3436';
        readingArea.style.color = fontColor;
        
        // 悬浮条调整大小功能
        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            e.stopPropagation();
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        });
        
        function onResize(e) {
            if (!isResizing) return;
            
            const rect = floatBar.getBoundingClientRect();
            const newHeight = e.clientY - rect.top;
            
            // 限制高度范围：50px - 200px
            const clampedHeight = Math.min(Math.max(newHeight, 50), 200);
            
            floatBar.style.height = clampedHeight + 'px';
            // 同时更新主进程中的悬浮条高度
            ipcRenderer.send('resize-float-bar', floatBarWidth, clampedHeight);
        }
        
        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
        }
        
        // 图标区域点击展开
        iconArea.addEventListener('click', () => {
            if (isDragging || isResizing) return;
            floatBar.style.display = 'none';
            readerContainer.style.display = 'flex';
            ipcRenderer.send('expand-window');
            
            // 展开时恢复滚动位置
            if (currentFilename && chapters.length > 0) {
                const saved = localStorage.getItem(`novel_${currentFilename}`);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        setTimeout(() => {
                            readingArea.scrollTop = data.scrollTop || 0;
                        }, 100);
                    } catch (e) {
                        console.error('恢复滚动位置失败:', e);
                    }
                }
            }
        });
        

        
        // 鼠标离开阅读器容器时延迟收起
        let collapseTimer = null;
        readerContainer.addEventListener('mouseleave', (event) => {
            if (isDragging || isLocked) return;
            
            // 检查鼠标是否真的离开了窗口区域
            const rect = readerContainer.getBoundingClientRect();
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // 如果鼠标还在窗口范围内，不收起
            if (mouseX >= rect.left && mouseX <= rect.right &&
                mouseY >= rect.top && mouseY <= rect.bottom) {
                return;
            }
            
            // 延迟 500ms 收起
            collapseTimer = setTimeout(() => {
                saveProgress();
                readerContainer.style.display = 'none';
                floatBar.style.display = 'flex';
                ipcRenderer.send('collapse-window');
            }, 500);
        });
        
        // 鼠标重新进入时取消收起
        readerContainer.addEventListener('mouseenter', () => {
            if (collapseTimer) {
                clearTimeout(collapseTimer);
                collapseTimer = null;
            }
        });
        
        // 文件拖拽支持
        readerContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
        
        readerContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.txt')) {
                readFileWithEncoding(file);
            }
        });
        
        // 文件上传
        function openFile() {
            document.getElementById('fileInput').click();
        }
        
        function readFileWithEncoding(file) {
            currentFilename = file.name;
            const reader = new FileReader();
            reader.onload = (event) => {
                const arrayBuffer = event.target.result;
                const buffer = Buffer.from(arrayBuffer);
                const jschardet = require('jschardet');
                const iconv = require('iconv-lite');
                const detected = jschardet.detect(buffer);
                const encoding = detected && detected.encoding ? detected.encoding : 'utf-8';
                const content = iconv.decode(buffer, encoding);
                parseContent(content);
                saveProgress();
            };
            reader.readAsArrayBuffer(file);
        }
        
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            readFileWithEncoding(file);
        });
        
        // 解析内容
        function parseContent(content) {
            const lines = content.split('\n');
            chapters = [];
            let currentContent = '';
            
            // 支持多种章节格式：
            // 1. 第一章、第一百章（中文数字）
            // 2. 第1章、第100章（阿拉伯数字）
            // 3. Chapter 1、Chapter 10（英文）
            const chapterPattern = /^(第[零一二三四五六七八九十百千\d]+章|Chapter\s*\d+|第\d+章)/;
            
            lines.forEach(line => {
                if (line.match(chapterPattern)) {
                    if (currentContent.trim()) chapters.push(currentContent.trim());
                    currentContent = line + '\n';
                } else {
                    currentContent += line + '\n';
                }
            });
            
            if (currentContent.trim()) chapters.push(currentContent.trim());
            
            // 如果没有找到章节，按每50行分割成一个章节
            if (chapters.length === 1 && chapters[0].split('\n').length > 100) {
                const allLines = chapters[0].split('\n');
                chapters = [];
                let tempChapter = '';
                allLines.forEach((line, index) => {
                    tempChapter += line + '\n';
                    if ((index + 1) % 50 === 0) {
                        chapters.push(tempChapter.trim());
                        tempChapter = '';
                    }
                });
                if (tempChapter.trim()) chapters.push(tempChapter.trim());
            }
            
            loadProgress();
            showChapter(currentChapter);
            buildToc();
            titleSpan.textContent = `${currentFilename} (${chapters.length}章)`;
        }
        
        // 显示章节
        function showChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            currentChapter = index;
            
            const content = chapters[index];
            const lines = content.split('\n');
            
            let html = '';
            if (lines[0].match(/^第[零一二三四五六七八九十百千]+章/) || lines[0].match(/^第\d+章/)) {
                html = `<div class="chapter-title">${lines[0]}</div>`;
                lines.shift();
            }
            
            lines.forEach(line => {
                if (line.trim()) html += `<p>${line.trim()}</p>`;
            });
            
            readingArea.innerHTML = html;
            
            // 恢复滚动位置（使用 requestAnimationFrame 确保 DOM 已渲染）
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (window.savedScrollTop !== undefined) {
                        readingArea.scrollTop = window.savedScrollTop;
                        window.savedScrollTop = undefined;
                    }
                });
            });
            
            updateProgress();
            // 更新目录中当前章节的高亮
            const tocItems = document.querySelectorAll('.toc-item');
            tocItems.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }
        
        // 目录功能
        function toggleToc() {
            const panel = document.getElementById('tocPanel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                buildToc();
                panel.style.display = 'block';
            }
        }
        
        function buildToc() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';
            chapters.forEach((chapter, index) => {
                const firstLine = chapter.split('\n')[0].trim();
                const title = firstLine.match(/^第[零一二三四五六七八九十百千\d]+章/) 
                    || firstLine.match(/^Chapter\s*\d+/)
                    || `第${index + 1}章`;
                const div = document.createElement('div');
                div.className = 'toc-item' + (index === currentChapter ? ' active' : '');
                div.textContent = title;
                div.onclick = () => {
                    showChapter(index);
                    document.getElementById('tocPanel').style.display = 'none';
                    saveProgress();
                };
                tocList.appendChild(div);
            });
        }
        
        // 实时保存滚动位置
        readingArea.addEventListener('scroll', () => {
            saveProgress();
        });
        
        // 切换锁定状态
        function toggleLock() {
            isLocked = !isLocked;
            const lockBtn = document.getElementById('lockBtn');
            lockBtn.textContent = isLocked ? '🔒' : '🔓';
            lockBtn.title = isLocked ? '解锁窗口' : '锁定窗口';
            ipcRenderer.send('toggle-always-on-top', isLocked);
        }
        
        // 自动滚动功能
        function toggleAutoScroll() {
            const autoScrollBtn = document.getElementById('autoScrollBtn');
            
            // 切换速度：0→1→2→0
            autoScrollSpeed = (autoScrollSpeed + 1) % 3;
            
            // 清除之前的定时器
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            
            if (autoScrollSpeed === 0) {
                // 关闭自动滚动
                autoScrollBtn.textContent = '▶️';
                autoScrollBtn.title = '自动滚动';
            } else {
                // 启动自动滚动
                const speed = autoScrollSpeed === 1 ? 30 : 15;  // 慢速30ms, 快速15ms
                autoScrollBtn.textContent = autoScrollSpeed === 1 ? '🐢' : '🐇';
                autoScrollBtn.title = autoScrollSpeed === 1 ? '慢速滚动' : '快速滚动';
                
                autoScrollTimer = setInterval(() => {
                    if (readingArea.scrollTop < readingArea.scrollHeight - readingArea.clientHeight) {
                        readingArea.scrollTop += 1;
                    } else {
                        // 滚动到底部，自动切换下一章
                        nextChapter();
                    }
                }, speed);
            }
        }
        
        // 键盘快捷键监听
        document.addEventListener('keydown', (event) => {
            // 方向键切换章节（左右方向键）
            if (event.key === 'ArrowLeft') {
                prevChapter();
            } else if (event.key === 'ArrowRight') {
                nextChapter();
            }
        });
        
        // 切换工具栏收起/展开
        function toggleToolbar() {
            toolbarCollapsed = !toolbarCollapsed;
            const toolbar = document.querySelector('.toolbar');
            const toggleBtn = document.getElementById('toggleToolbarBtn');
            const rows = toolbar.querySelectorAll('.toolbar-row');
            
            toggleBtn.style.display = '';
            
            if (toolbarCollapsed) {
                rows.forEach((row, index) => {
                    if (index === 1) {
                        row.style.display = 'none';
                    } else {
                        row.style.display = 'flex';
                        const items = row.querySelectorAll(':not(#toggleToolbarBtn)');
                        items.forEach(item => {
                            if (item.classList.contains('chapter-btn') || item.classList.contains('lock-btn') || item.classList.contains('auto-scroll-btn') || item.classList.contains('toc-btn')) {
                                item.style.display = '';
                            } else {
                                item.style.display = 'none';
                            }
                        });
                    }
                });
                toolbar.style.background = 'transparent';
                toggleBtn.textContent = '⬇️';
                toggleBtn.title = '展开工具栏';
            } else {
                rows.forEach((row, index) => {
                    row.style.display = 'flex';
                    const items = row.querySelectorAll(':not(#toggleToolbarBtn)');
                    items.forEach(item => {
                        if (item.classList.contains('chapter-btn') || item.classList.contains('lock-btn') || item.classList.contains('resize-btn') || item.classList.contains('auto-scroll-btn') || item.classList.contains('toc-btn')) {
                            item.style.display = 'none';
                        } else {
                            item.style.display = '';
                        }
                    });
                });
                toolbar.style.background = 'linear-gradient(135deg, rgba(99, 102, 241, 0.92) 0%, rgba(139, 92, 246, 0.92) 100%)';
                toggleBtn.textContent = '⬆️';
                toggleBtn.title = '收起工具栏';
            }
        }
        
        // 调整窗口大小
        function resizeWindow(type, value) {
            const ipcRenderer = require('electron').ipcRenderer;
            ipcRenderer.send('resize-window', type, value);
        }
        
        function prevChapter() {
            if (currentChapter > 0) {
                readingArea.scrollTop = 0;  // 切换章节时重置到顶部
                showChapter(currentChapter - 1);
                saveProgress();
            }
        }
        function nextChapter() {
            if (currentChapter < chapters.length - 1) {
                readingArea.scrollTop = 0;  // 切换章节时重置到顶部
                showChapter(currentChapter + 1);
                saveProgress();
            }
        }
        
        function updateProgress() {
            const progress = ((currentChapter + 1) / chapters.length) * 100;
            document.querySelector('.progress-slider').value = progress;
            progressSpan.textContent = `${Math.round(progress)}%`;
        }
        
        function seekTo(value) {
            const index = Math.floor((value / 100) * chapters.length);
            showChapter(Math.min(index, chapters.length - 1));
            saveProgress();
        }
        
        function changeFont(size) {
            readingArea.style.fontSize = `${size}px`;
        }
        
        // 切换颜色选择器显示
        function toggleColorPicker() {
            const panel = document.getElementById('colorPickerPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }
        
        // 改变字体颜色
        function changeFontColor(hex) {
            fontColor = hex;
            readingArea.style.color = hex;
            localStorage.setItem('novelReader_fontColor', hex);
            document.getElementById('colorPickerPanel').style.display = 'none';
        }
        
        // 点击色盘外部关闭
        document.addEventListener('click', (event) => {
            const panel = document.getElementById('colorPickerPanel');
            const wrapper = document.querySelector('.color-wrapper');
            if (panel.style.display === 'block' && wrapper && !wrapper.contains(event.target)) {
                panel.style.display = 'none';
            }
        });
        
        // 调整背景透明度（工具栏不受影响）
        function changeOpacity(value) {
            readingArea.style.background = `rgba(255, 255, 255, ${value / 100})`;
            document.querySelector('.progress-bar').style.background = `rgba(255, 255, 255, ${value / 100})`;
            localStorage.setItem('novelReader_opacity', value);  // 保存透明度
        }
        
        // 保存进度（包括章节和滚动位置）
        function saveProgress() {
            if (!currentFilename || chapters.length === 0) return;
            const progressData = {
                chapter: currentChapter,
                scrollTop: readingArea.scrollTop,  // 保存滚动位置
                totalChapters: chapters.length,
                timestamp: Date.now()
            };
            localStorage.setItem(`novel_${currentFilename}`, JSON.stringify(progressData));
        }
        
        // 加载进度
        function loadProgress() {
            if (!currentFilename) {
                currentChapter = 0;
                window.savedScrollTop = 0;
                return;
            }
            const saved = localStorage.getItem(`novel_${currentFilename}`);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.chapter >= 0 && data.chapter < chapters.length) {
                        currentChapter = data.chapter;
                        // 保存滚动位置，在章节显示后恢复
                        window.savedScrollTop = data.scrollTop || 0;
                    } else {
                        currentChapter = 0;
                        window.savedScrollTop = 0;
                    }
                } catch (e) {
                    currentChapter = 0;
                    window.savedScrollTop = 0;
                }
            } else {
                currentChapter = 0;
                window.savedScrollTop = 0;
            }
        }
        
        // 初始化检查
        document.addEventListener('DOMContentLoaded', () => {
            ipcRenderer.send('init-window');
            toolbarCollapsed = false;
            const toolbar = document.querySelector('.toolbar');
            const toggleBtn = document.getElementById('toggleToolbarBtn');
            const rows = toolbar.querySelectorAll('.toolbar-row');
            
            rows.forEach(row => {
                row.style.display = 'flex';
                const items = row.querySelectorAll(':not(#toggleToolbarBtn)');
                items.forEach(item => {
                    if (item.classList.contains('chapter-btn') || item.classList.contains('lock-btn') || item.classList.contains('resize-btn') || item.classList.contains('auto-scroll-btn') || item.classList.contains('toc-btn')) {
                        item.style.display = 'none';
                    } else {
                        item.style.display = '';
                    }
                });
            });
            toolbar.style.background = 'linear-gradient(135deg, rgba(99, 102, 241, 0.92) 0%, rgba(139, 92, 246, 0.92) 100%)';
            toggleBtn.textContent = '⬆️';
            toggleBtn.title = '收起工具栏';
        });
    </script>
</body>
</html>
